<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="QuestBox starter kit with base, cartridges and treats">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="74%">
