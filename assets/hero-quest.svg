<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="QuestBox base with cartridge snapped in and a floating expansion pack">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A6650"/>
      <stop offset="100%" stop-color="#1E3A2B"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#F1E4CB"/>
    </linearGradient>
    <linearGradient id="hubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A47"/>
      <stop offset="100%" stop-color="#F4581C"/>
    </linearGradient>
    <linearGradient id="floattile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#F2E5CC"/>
    </linearGradient>
  </defs>
  <!-- soft backdrop -->
  <ellipse cx="450" cy="700" rx="330" ry="34" fill="#1E3A2B" opacity=".14"/>
  <!-- paw trail -->
  <g fill="#1E3A2B" opacity=".14">
    <g transform="translate(96 588) rotate(-14) scale(.8)">
      <ellipse cx="0" cy="0" rx="9" ry="13"/><ellipse cx="20" cy="2" rx="8" ry="11"/><ellipse cx="-20" cy="2" rx="8" ry="11"/>
      <path d="M0 8c12 0 20 8 20 17s-8 16-20 16-20-7-20-16 8-17 20-17z"/>
    </g>
    <g transform="translate(190 640) rotate(10) scale(.65)">
      <ellipse cx="0" cy="0" rx="9" ry="13"/><ellipse cx="20" cy="2" rx="8" ry="11"/><ellipse cx="-20" cy="2" rx="8" ry="11"/>
      <path d="M0 8c12 0 20 8 20 17s-8 16-20 16-20-7-20-16 8-17 20-17z"/>
    </g>
  </g>
  <!-- base unit -->
  <g transform="translate(96 168) scale(0.98)">
    <ellipse cx="330" cy="500" rx="290" ry="36" fill="#1E3A2B" opacity=".18"/>
    <rect x="130" y="80" width="400" height="400" rx="80" fill="url(#shell)"/>
    <rect x="140" y="90" width="380" height="380" rx="70" fill="none" stroke="#FFFFFF" opacity=".14" stroke-width="3"/>
    <rect x="160" y="110" width="340" height="340" rx="62" fill="url(#deck)"/>
    <circle cx="330" cy="280" r="92" fill="url(#hubg)"/>
    <circle cx="330" cy="280" r="66" fill="#1E3A2B"/>
    <circle cx="330" cy="280" r="66" fill="none" stroke="#FFB937" stroke-width="6" stroke-dasharray="3 15" stroke-linecap="round"/>
    <g fill="#FFF7E8">
      <ellipse cx="318" cy="265" rx="7" ry="10" transform="rotate(-18 318 265)"/>
      <ellipse cx="342" cy="265" rx="7" ry="10" transform="rotate(18 342 265)"/>
      <ellipse cx="305" cy="283" rx="6" ry="8" transform="rotate(-42 305 283)"/>
      <ellipse cx="355" cy="283" rx="6" ry="8" transform="rotate(42 355 283)"/>
      <path d="M330 273c10 0 17 7 17 15s-7 15-17 15-17-7-17-15 7-15 17-15z"/>
    </g>
    <rect x="196" y="146" width="72" height="72" rx="20" fill="#2C5243"/>
    <rect x="207" y="157" width="50" height="50" rx="14" fill="#FFF7E8"/>
    <rect x="392" y="146" width="72" height="72" rx="20" fill="#2C5243"/>
    <rect x="403" y="157" width="50" height="50" rx="14" fill="#FFF7E8"/>
    <rect x="196" y="342" width="72" height="72" rx="20" fill="#2C5243"/>
    <rect x="207" y="353" width="50" height="50" rx="14" fill="#FFF7E8"/>
    <rect x="392" y="342" width="72" height="72" rx="20" fill="#2C5243"/>
    <rect x="403" y="353" width="50" height="50" rx="14" fill="#FFF7E8"/>
  </g>
  <!-- snapped-in cartridge (scent trail) -->
  <g transform="translate(150 60) rotate(-4)">
    <rect x="0" y="0" width="220" height="220" rx="38" fill="#FF6B2C"/>
    <rect x="9" y="9" width="202" height="202" rx="32" fill="url(#floattile)"/>
    <path d="M52 96 C84 66 130 116 168 88" fill="none" stroke="#FF6B2C" stroke-width="7" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle cx="52" cy="96" r="12" fill="#2A2E28"/>
    <circle cx="112" cy="110" r="17" fill="#2C5243"/>
    <circle cx="112" cy="110" r="9" fill="#8A5A32"/>
    <circle cx="162" cy="150" r="17" fill="#2C5243"/>
    <circle cx="162" cy="150" r="9" fill="#8A5A32"/>
    <circle cx="70" cy="160" r="14" fill="#FFB937"/>
    <circle cx="70" cy="160" r="7" fill="#8A5A32"/>
  </g>
  <!-- floating cartridge (rotating wheel) -->
  <g transform="translate(600 140) rotate(7)">
    <rect x="-12" y="-12" width="250" height="250" rx="44" fill="#1E3A2B" opacity=".12"/>
    <rect x="0" y="0" width="226" height="226" rx="40" fill="#FFB937"/>
    <rect x="9" y="9" width="208" height="208" rx="34" fill="url(#floattile)"/>
    <circle cx="113" cy="113" r="66" fill="#2C5243"/>
    <circle cx="113" cy="113" r="54" fill="#FFF7E8"/>
    <g stroke="#2C5243" stroke-width="10" stroke-linecap="round">
      <line x1="113" y1="113" x2="113" y2="62"/>
      <line x1="113" y1="113" x2="160" y2="140"/>
      <line x1="113" y1="113" x2="66" y2="140"/>
    </g>
    <circle cx="113" cy="113" r="20" fill="#FF6B2C"/>
    <circle cx="113" cy="66" r="10" fill="#FFB937"/>
    <circle cx="160" cy="140" r="10" fill="#FFB937"/>
  </g>
  <!-- dashed link path -->
  <path d="M400 150 C480 120 540 130 592 190" stroke="#FF6B2C" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="1 14" opacity=".8"/>
  <!-- treats -->
  <g transform="translate(618 470) rotate(-16)" fill="#8A5A32">
    <rect x="0" y="0" width="72" height="22" rx="11"/>
    <circle cx="2" cy="4" r="13"/><circle cx="2" cy="18" r="13"/>
    <circle cx="70" cy="4" r="13"/><circle cx="70" cy="18" r="13"/>
  </g>
  <g transform="translate(96 96) rotate(12) scale(.72)" fill="#8A5A32" opacity=".85">
    <rect x="0" y="0" width="72" height="22" rx="11"/>
    <circle cx="2" cy="4" r="13"/><circle cx="2" cy="18" r="13"/>
    <circle cx="70" cy="4" r="13"/><circle cx="70" cy="18" r="13"/>
  </g>
  <!-- sparkles -->
  <path d="M560 96l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#FFB937"/>
  <path d="M810 420l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#FF6B2C" opacity=".7"/>
  <path d="M60 320l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#FFB937" opacity=".8"/>
</svg>
