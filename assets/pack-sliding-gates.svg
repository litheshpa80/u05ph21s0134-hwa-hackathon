<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Sliding Gates puzzle cartridge">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#F4ECDB"/>
      <stop offset="100%" stop-color="#E9DBC2"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#F2E5CC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="44" fill="url(#bg)"/>
  <ellipse cx="320" cy="566" rx="210" ry="24" fill="#1E3A2B" opacity=".15"/>
  <rect x="120" y="110" width="400" height="400" rx="64" fill="#FFB937"/>
  <rect x="134" y="124" width="372" height="372" rx="54" fill="url(#tile)"/>
  <rect x="296" y="98" width="48" height="24" rx="10" fill="#2C5243"/>
  <rect x="296" y="498" width="48" height="24" rx="10" fill="#2C5243"/>
  <rect x="98" y="292" width="24" height="48" rx="10" fill="#2C5243"/>
  <rect x="518" y="292" width="24" height="48" rx="10" fill="#2C5243"/>
  <!-- rails -->
  <rect x="188" y="236" width="264" height="10" rx="5" fill="#E4D5B8"/>
  <rect x="188" y="394" width="264" height="10" rx="5" fill="#E4D5B8"/>
  <!-- treats behind gates -->
  <circle cx="268" cy="300" r="17" fill="#8A5A32"/>
  <circle cx="268" cy="316" r="17" fill="#8A5A32" opacity=".55"/>
  <circle cx="396" cy="452" r="17" fill="#8A5A32"/>
  <circle cx="396" cy="436" r="17" fill="#8A5A32" opacity=".55"/>
  <!-- sliding gates -->
  <g>
    <rect x="236" y="212" width="64" height="176" rx="18" fill="#2C5243"/>
    <rect x="248" y="226" width="40" height="148" rx="13" fill="#3A6650"/>
    <circle cx="268" cy="300" r="15" fill="#FF6B2C"/>
    <circle cx="268" cy="300" r="6" fill="#FFF7E8"/>
    <rect x="364" y="252" width="64" height="176" rx="18" fill="#2C5243"/>
    <rect x="376" y="266" width="40" height="148" rx="13" fill="#3A6650"/>
    <circle cx="396" cy="340" r="15" fill="#FF6B2C"/>
    <circle cx="396" cy="340" r="6" fill="#FFF7E8"/>
  </g>
  <!-- motion arrows -->
  <path d="M204 300h-24m0 0l8-8m-8 8l8 8" stroke="#FF6B2C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M460 340h24m0 0l-8-8m8 8l-8 8" stroke="#FF6B2C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480 178l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#FF6B2C" opacity=".7"/>
  <g>
    <circle cx="290" cy="548" r="7" fill="#FF6B2C"/>
    <circle cx="312" cy="548" r="7" fill="#FF6B2C"/>
    <circle cx="334" cy="548" r="7" fill="none" stroke="#C9B896" stroke-width="2.4"/>
    <circle cx="356" cy="548" r="7" fill="none" stroke="#C9B896" stroke-width="2.4"/>
  </g>
</svg>
